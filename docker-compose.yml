services:
  pichost:
    # Docker Hub 镜像（推送 main 分支后由 GitHub Actions 自动构建）
    # 飞牛 Docker 对 Docker Hub 的「更新镜像」支持更好
    image: muxui/pichost:latest
    pull_policy: always
    container_name: pichost
    restart: unless-stopped
    ports:
      - "6892:6892"
    # 首次访问 Web 引导创建管理员，无需预先配置环境变量
    # 可选：environment 中设置 API_UPLOAD_TOKEN、ALLOWED_REFERER_HOSTS 等
    # 运维：docker exec pichost reset-password | slider | clear-domains | backup-export | backup-restore | storage-sync
    volumes:
      # 冒号左边改成 NAS 上的实际存图目录（飞牛示例：/vol1/1000/pichost-data）
      - ./data:/data
